<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عذراً يا جمانة</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(120deg, #ff9a9e, #fad0c4);
      text-align: center;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .container {
      animation: fadeIn 2s;
    }
    h1 {
      color: #ffffff;
      font-size: 3em;
      margin: 0 0 20px 0;
    }
    p {
      font-size: 1.2em;
      color: #ffffff;
    }
    button {
      background-color: #ffffff;
      color: #ff6f61;
      border: none;
      padding: 15px 30px;
      font-size: 1.2em;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      transition: transform 0.3s ease, background-color 0.3s ease;
    }
    button:hover {
      background-color: #ff6f61;
      color: #ffffff;
      transform: scale(1.1);
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>عذراً يا جمانة 💖</h1>
    <p>أعلم أنني أخطأت، وأريد أن أوضح لك كم أنا آسف.</p>
    <button onclick="goToPage()">اضغطي هنا لرؤية المفاجأة</button>
  </div>
  <script>
    function goToPage() {
      document.body.style.animation = "fadeOut 1s forwards";
      setTimeout(() => {
        window.location.href = "page2.html";
      }, 1000);
    }
  </script>
</body>
</html>
