<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إلى جمانة</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(120deg, #ff6f61, #ff9a9e);
      color: #ffffff;
      text-align: center;
      margin: 0;
      padding: 20px;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: fadeIn 2s;
    }
    .message-box {
      max-width: 600px;
      background: rgba(255, 255, 255, 0.1);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      animation: slideIn 1.5s ease-out;
    }
    h1 {
      font-size: 2.5em;
      margin-bottom: 20px;
    }
    p {
      font-size: 1.5em;
      line-height: 1.6;
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
    @keyframes slideIn {
      from {
        transform: translateY(100px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="message-box">
    <h1>إلى أجمل إنسانة في حياتي 💕</h1>
    <p>
      أعلم أنني ربما أخطأت أو لم أكن الشخص الذي تستحقينه دائمًا،  
      ولكن من أعماق قلبي أقول لك: أنتِ كل شيء بالنسبة لي.  
      أعدك بأن أكون الأفضل، وأن أجعل كل لحظة تجمعنا مليئة بالسعادة والحب.  
      أحبك يا جمانة ❤️.
    </p>
  </div>
</body>
</html>
